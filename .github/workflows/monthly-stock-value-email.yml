name: Monthly Stock Value Email

on:
  schedule:
    - cron: '1 0 1 * *'  # 00:01 UTC on the 1st of every month (00:01 GMT / 01:01 BST — per Neil Rosie 2026-09-02)

concurrency:
  group: monthly-stock-value-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Stock Value email
        run: |
          curl -f "https://gc4creportsandstock.netlify.app/.netlify/functions/trigger-stock-value-email-background?secret=gc4c-test-2026"
